# Dependency security check
#
# dependency-review-action requires GitHub Advanced Security, which is free
# for public repositories but a paid add-on for private ones. This workflow
# therefore branches on repository visibility:
#
#   Public (ce)   -> dependency-review-action. Scans only the dependencies
#                    added or updated in the PR. Clean signal, safe to mark
#                    as a required check.
#   Private (ee)  -> pnpm audit. Scans the entire lockfile for known
#                    vulnerabilities, so it may also flag pre-existing issues
#                    unrelated to the PR.
#
# Note: github.event.repository.private is only present on pull_request
# events. If other triggers are added, switch to a repository variable.
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Public repository: GHAS available ---
      - name: Dependency Review
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      # --- Private repository: fall back to pnpm audit ---
      - name: Setup pnpm
        if: ${{ github.event.repository.private }}
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        if: ${{ github.event.repository.private }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Audit dependencies
        if: ${{ github.event.repository.private }}
        run: pnpm audit --audit-level=high