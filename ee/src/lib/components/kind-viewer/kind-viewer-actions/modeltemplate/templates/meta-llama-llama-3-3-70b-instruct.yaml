apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: meta-llama-llama-3-3-70b-instruct
  namespace: otterscale-system
spec:
  model:
    name: meta-llama/Llama-3.3-70B-Instruct
    uri: hf://meta-llama/Llama-3.3-70B-Instruct
  parallelism:
    tensor: 8
  replicas: 1
  router:
    gateway: {}
    route: {}
    scheduler: {}
  template:
    containers:
      - args:
          - --tensor-parallel-size
          - "8"
          - --async-scheduling
          - --no-enable-prefix-caching
          - --max-num-batched-tokens
          - "8192"
          - --max-num-seqs
          - "256"
          - --gpu-memory-utilization
          - "0.9"
        env:
          - name: LIBRARY_PATH
            value: /usr/lib/x86_64-linux-gnu:/usr/lib64
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 5
        name: main
        resources:
          limits:
            cpu: "36"
            memory: 36Gi
            nvidia.com/gpu: "8"
          requests:
            cpu: "18"
            memory: 36Gi
            nvidia.com/gpu: "8"
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          periodSeconds: 60
          successThreshold: 1
          timeoutSeconds: 5
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
    volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 9Gi
        name: dshm